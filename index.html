<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ujian PJOK Kelas 3 A</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dashboard Utama -->
    <div id="dashboard" class="container">
        <h1>Dashboard Ujian PJOK</h1>
        <h2>Kelas 3 A</h2>
        <button id="btn-mulai" onclick="bukaForm()">Klik untuk Mengerjakan</button>

        <!-- Tabel Rekapitulasi Nilai -->
        <div class="tabel-container">
            <h3>Rekapitulasi Hasil Ujian</h3>
            <table id="tabel-nilai">
                <thead>
                    <tr>
                        <th>Nama Lengkap</th>
                        <th>Kelas</th>
                        <th>Mata Pelajaran</th>
                        <th>Nilai</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data akan diisi oleh JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Form Data Diri -->
    <div id="form-peserta" class="container hidden">
        <h2>Isi Data Diri</h2>
        <div class="input-group">
            <label>Nama Lengkap:</label>
            <input type="text" id="input-nama" placeholder="Masukkan nama lengkap">
        </div>
        <div class="input-group">
            <label>Kelas:</label>
            <input type="text" id="input-kelas" value="3 A" readonly>
        </div>
        <div class="input-group">
            <label>Mata Pelajaran:</label>
            <input type="text" id="input-mapel" value="PJOK" readonly>
        </div>
        <button onclick="mulaiKuis()">Mulai Ujian</button>
    </div>

    <!-- Halaman Soal Kuis -->
    <div id="area-kuis" class="container hidden">
        <div class="Kuis-header">
            <h3 id="info-pengerjaan">Mengerjakan...</h3>
            <div id="nomor-soal">Soal 1 dari 30</div>
        </div>
        <div id="teks-soal" class="soal">Pertanyaan akan muncul di sini.</div>
        <div id="pilihan-jawaban" class="pilihan-wadah">
            <!-- Pilihan jawaban akan diisi oleh JavaScript -->
        </div>
        <button id="btn-next" onclick="soalBerikutnya()">Selanjutnya</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
